<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스트레스 조사 집계</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">전체 집계 · 개인 응답은 공개되지 않습니다</p>
      <h1>직무스트레스 원인 조사 결과</h1>
      <div id="empty" class="lead">불러오는 중…</div>
      <div id="body" hidden>
        <div class="kpis">
          <div class="kpi"><b id="n"></b><span>참여 인원</span></div>
          <div class="kpi"><b id="avg"></b><span>평균 점수 / 100</span></div>
          <div class="kpi"><b id="high"></b><span>높음 이상 비율</span></div>
        </div>
        <h3>요인별 평균 스트레스 (높은 순)</h3>
        <div id="factors" class="factors"></div>
        <p class="fine">점수가 높을수록 해당 요인으로 인한 스트레스가 크다는 뜻입니다 (0~100).</p>
      </div>
      <a class="btn ghost" href="index.html">설문 참여하기</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="items.js"></script>
  <script>
    (async () => {
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data, error } = await db.rpc("get_stress_summary");
      const $ = (id) => document.getElementById(id);
      if (error) { $("empty").textContent = "결과를 불러오지 못했습니다."; return; }
      if (!data.respondents) { $("empty").textContent = "아직 응답이 없습니다."; return; }
      $("empty").hidden = true;
      $("body").hidden = false;
      $("n").textContent = `${data.respondents}명`;
      $("avg").textContent = data.avg_total;
      const high = (data.levels["높음"] || 0) + (data.levels["매우 높음"] || 0);
      $("high").textContent = `${Math.round((high / data.respondents) * 100)}%`;
      $("factors").innerHTML = ITEMS.map((item, i) => ({ item, s: Number(data.item_avgs[i]) }))
        .sort((a, b) => b.s - a.s)
        .map(({ item, s }) => `
          <div class="factor ${barClass(s)}">
            <div class="top"><span>${item.name} <span class="fine">· ${item.area}</span></span><span>${s.toFixed(1)}</span></div>
            <div class="track"><div class="fill" style="width:${Math.max(s, 2)}%"></div></div>
            <div class="fine">개선 제안: ${item.tip}</div>
          </div>`).join("");
    })();
  </script>
</body>
</html>
